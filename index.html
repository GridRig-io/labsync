<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="LabSync — laboratory inventory, blood bank, cold chain and tasks." />
    <title>LabSync</title>
    <script>
      try {
        var t = localStorage.getItem('ls-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        var s = localStorage.getItem('ls-size'); if (s) document.documentElement.dataset.size = s;
        var n = localStorage.getItem('ls-density'); if (n) document.documentElement.dataset.density = n;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
